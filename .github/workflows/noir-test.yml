name: Noir Tests and Formatting

on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
  pull_request:

permissions:
  contents: read

env:
  NOIR_VERSION: 1.0.0-beta.26
  # noir-lang/noirup commit (v0.1.5). The noirup GitHub action is not used because it
  # internally calls an unpinned actions/cache, which the org policy rejects.
  NOIRUP_SHA: bedac8fbe6a059177c35e565f9f76db54a795976

jobs:
  test:
    name: nargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Noir
        run: |
          curl -fsSL "https://raw.githubusercontent.com/noir-lang/noirup/$NOIRUP_SHA/noirup" | bash -s -- --version "$NOIR_VERSION"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - run: cd babyjubjub && nargo test
      - run: cd oprf && nargo test
      - run: cd oprf_example && nargo test

  fmt:
    name: nargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Noir
        run: |
          curl -fsSL "https://raw.githubusercontent.com/noir-lang/noirup/$NOIRUP_SHA/noirup" | bash -s -- --version "$NOIR_VERSION"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - run: cd babyjubjub && nargo fmt --check
      - run: cd oprf && nargo fmt --check
      - run: cd oprf_example && nargo fmt --check
