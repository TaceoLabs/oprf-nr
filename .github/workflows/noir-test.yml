name: Noir Tests and Formatting

on:
  push:
    branches:
      - main
    tags-ignore:
      - v*
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: nargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TODO: switch to a tagged noirup release once one includes the actions/cache SHA pin
      - uses: noir-lang/noirup@b6d3d6164977586b8338ff23a32a6a77bbb4510a # master
        with:
          toolchain: 1.0.0
      - run: cd babyjubjub && nargo test
      - run: cd oprf && nargo test
      - run: cd oprf_example && nargo test

  fmt:
    name: nargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TODO: switch to a tagged noirup release once one includes the actions/cache SHA pin
      - uses: noir-lang/noirup@b6d3d6164977586b8338ff23a32a6a77bbb4510a # master
        with:
          toolchain: 1.0.0
      - run: cd babyjubjub && nargo fmt --check
      - run: cd oprf && nargo fmt --check
      - run: cd oprf_example && nargo fmt --check
